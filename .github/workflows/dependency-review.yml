name: dependency-review

# Runs on pull requests from forks too: it needs no secrets and only reads.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    # Free on public repositories only; skipped until the repository is public.
    if: ${{ !github.event.repository.private }}
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
