# Local, disposable PostgreSQL and Mailpit for the harness (never hosted services).
#   docker compose up -d      start them
#   docker compose down -v    stop them and delete their data
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: harness
    ports:
      - '5432:5432'
    volumes:
      - harness-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every message the harness sends (HARNESS_SMTP_URL=smtp://localhost:1025):
  # read them at http://localhost:8025. Nothing is delivered beyond it.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  harness-postgres:
