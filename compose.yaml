# Local, disposable PostgreSQL for the harness (never a hosted database).
#   docker compose up -d      start it
#   docker compose down -v    stop it and delete its data
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: harness
    ports:
      - '5432:5432'
    volumes:
      - harness-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  harness-postgres:
